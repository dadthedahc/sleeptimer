<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2B3A8C"/><stop offset="1" stop-color="#141A45"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4C7"/><stop offset="1" stop-color="#F2C96B"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="500" cy="512" r="350" fill="white"/>
      <circle cx="615" cy="430" r="330" fill="black"/>
    </mask>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="barshadow" x="-40%" y="-20%" width="180%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B0F2E" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <g fill="#FFFFFF"><circle cx="840" cy="240" r="7" opacity="0.8"/><circle cx="790" cy="780" r="5" opacity="0.5"/></g>
    <rect width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)"/>
    <g fill="#FFFFFF" filter="url(#barshadow)">
      <rect x="470" y="200" width="125" height="450" rx="62"/>
      <rect x="630" y="200" width="125" height="450" rx="62"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>