<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1E1F72"/><stop offset="0.55" stop-color="#0E0F3A"/><stop offset="1" stop-color="#1A0C3A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A08CFF"/><stop offset="1" stop-color="#6A5CF5"/>
    </linearGradient>
    <linearGradient id="moon" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#8F7DFF"/><stop offset="0.5" stop-color="#5B55F2"/><stop offset="1" stop-color="#3A3FD9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9C8CFF"/><stop offset="1" stop-color="#5E5BF0"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="478" cy="505" r="158" fill="white"/>
      <circle cx="556" cy="448" r="138" fill="black"/>
      <rect x="566" y="574" width="216" height="210" rx="56" fill="black"/>
    </mask>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 1  0 0 0 0.55 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <g fill="#FFFFFF">
      <circle cx="250" cy="215" r="5" opacity="0.6"/><circle cx="800" cy="250" r="6" opacity="0.7"/>
      <circle cx="830" cy="560" r="4" opacity="0.5"/><circle cx="215" cy="760" r="4" opacity="0.4"/>
      <circle cx="660" cy="190" r="3" opacity="0.5"/>
    </g>
    <g filter="url(#glow)" transform="translate(10 6)">
      <path d="M 711.7 537.3 A 215 215 0 1 0 481.3 714.2" fill="none" stroke="url(#ring)" stroke-width="24" stroke-linecap="round"/>
      <rect width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)"/>
      <rect x="590" y="592" width="72" height="172" rx="36" fill="url(#bar)"/>
      <rect x="690" y="592" width="72" height="172" rx="36" fill="url(#bar)"/>
    </g>
  </g>
</svg>
